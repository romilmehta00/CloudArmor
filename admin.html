<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Armor | Admin Security Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 h-screen flex flex-col font-sans">

    <nav class="bg-gray-900 p-4 text-white flex justify-between items-center border-b border-gray-700">
        <h1 class="text-xl font-bold text-red-500">🛡️ Cloud Armor: Admin Terminal</h1>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-gray-300 hover:text-white">Go to Vault</a>
            <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-700">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-6 flex-grow text-gray-100">
        <div class="grid grid-cols-4 gap-4 mb-8" id="statsGrid">
            </div>

        <div class="bg-gray-900 p-6 rounded-lg shadow-lg border border-red-900 mb-8">
            <h2 class="text-lg font-bold mb-4 text-red-400">🚨 Active Intrusion Blocks</h2>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-gray-800 text-gray-400 border-b border-gray-700">
                        <th class="p-2">IP Address</th>
                        <th class="p-2">Reason</th>
                        <th class="p-2">Blocked Until</th>
                        <th class="p-2 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="blockedTableBody"></tbody>
            </table>
        </div>

        <div class="bg-gray-900 p-6 rounded-lg shadow-lg border border-gray-700 mb-8">
            <h2 class="text-lg font-bold mb-4 text-green-400">👥 User Management</h2>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-gray-800 text-gray-400 border-b border-gray-700">
                        <th class="p-2">Username</th>
                        <th class="p-2">Email</th>
                        <th class="p-2">Role</th>
                        <th class="p-2 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>

        <div class="bg-gray-900 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-blue-400">System Activity Logs</h2>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-gray-800 text-gray-400 border-b border-gray-700">
                        <th class="p-2">Timestamp</th>
                        <th class="p-2">Action</th>
                        <th class="p-2">User / IP</th>
                        <th class="p-2">Details</th>
                        <th class="p-2">Threat Level</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchAdminData() {
            // Fetch Stats
            const statsRes = await fetch('/api/admin/stats');
            if (statsRes.status === 403) window.location.href = '/dashboard';
            const stats = await statsRes.json();
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="bg-gray-900 p-4 rounded border border-gray-700"><p class="text-gray-400 text-sm">Total Users</p><p class="text-2xl font-bold">${stats.total_users}</p></div>
                <div class="bg-gray-900 p-4 rounded border border-gray-700"><p class="text-gray-400 text-sm">Files Secured</p><p class="text-2xl font-bold">${stats.total_files}</p></div>
                <div class="bg-gray-900 p-4 rounded border border-red-900"><p class="text-gray-400 text-sm">Blocked IPs</p><p class="text-2xl font-bold text-red-500">${stats.blocked_ips}</p></div>
                <div class="bg-gray-900 p-4 rounded border border-orange-800"><p class="text-gray-400 text-sm">Critical Events</p><p class="text-2xl font-bold text-orange-500">${stats.critical_events}</p></div>
            `;

            // Fetch Blocked IPs
            const blockedRes = await fetch('/api/admin/blocked-ips');
            const blockedIps = await blockedRes.json();
            const bBody = document.getElementById('blockedTableBody');
            bBody.innerHTML = blockedIps.length === 0 ? '<tr><td colspan="4" class="p-4 text-center text-gray-500">No active blocks</td></tr>' : '';
            blockedIps.forEach(b => {
                bBody.innerHTML += `<tr class="border-b border-gray-800 hover:bg-gray-800">
                    <td class="p-2 font-mono text-red-400">${b.ip}</td>
                    <td class="p-2">${b.reason}</td>
                    <td class="p-2">${new Date(b.blocked_until).toLocaleTimeString()}</td>
                    <td class="p-2 text-right"><button onclick="unblockIp('${b.ip}')" class="text-blue-400 hover:text-blue-300">Lift Block</button></td>
                </tr>`;
            });

            // Fetch Users
            const usersRes = await fetch('/api/admin/users');
            const usersData = await usersRes.json();
            const uBody = document.getElementById('usersTableBody');
            uBody.innerHTML = '';
            usersData.forEach(u => {
                const role = u.is_admin ? '<span class="text-yellow-400 font-bold">Admin</span>' : 'User';
                // Hide delete button for other admins
                const actionBtn = u.is_admin ? '' : `<button onclick="deleteUser('${u.user_id}')" class="text-red-500 hover:text-red-400 font-bold">Delete User & Files</button>`;
                
                uBody.innerHTML += `<tr class="border-b border-gray-800 hover:bg-gray-800">
                    <td class="p-2">${u.username}</td>
                    <td class="p-2">${u.email}</td>
                    <td class="p-2">${role}</td>
                    <td class="p-2 text-right">${actionBtn}</td>
                </tr>`;
            });

            // Fetch Logs
            const logsRes = await fetch('/api/admin/logs?limit=10');
            const logsData = await logsRes.json();
            const lBody = document.getElementById('logsTableBody');
            lBody.innerHTML = '';
            logsData.logs.forEach(l => {
                let colorClass = l.threat_level === 'critical' ? 'text-red-500' : (l.threat_level === 'warning' ? 'text-yellow-500' : 'text-gray-300');
                lBody.innerHTML += `<tr class="border-b border-gray-800 hover:bg-gray-800">
                    <td class="p-2 text-gray-500 text-xs">${new Date(l.timestamp).toLocaleString()}</td>
                    <td class="p-2 font-bold">${l.action}</td>
                    <td class="p-2">${l.user || 'Unknown'} / <span class="font-mono text-xs">${l.ip}</span></td>
                    <td class="p-2 text-gray-400 truncate max-w-xs">${l.details}</td>
                    <td class="p-2 uppercase text-xs font-bold ${colorClass}">${l.threat_level}</td>
                </tr>`;
            });
        }

        async function unblockIp(ip) {
            await fetch(`/api/admin/blocked-ips/${ip}/unblock`, { method: 'POST' });
            fetchAdminData();
        }

        async function deleteUser(userId) {
            if(!confirm('Delete this user and ALL their uploaded files from AWS S3?')) return;
            
            const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
            if(res.ok) {
                fetchAdminData(); // Refresh all tables to show updated stats
            } else {
                const data = await res.json();
                alert("Error: " + data.error);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        fetchAdminData();
    </script>
</body>
</html>
